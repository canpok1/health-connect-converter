name: build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup
        run: make setup

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.9.0

      - name: Test
        run: make test

      - name: Build
        run: make build
